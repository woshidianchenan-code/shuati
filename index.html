<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="污水刷题">
<meta name="theme-color" content="#1F6FE0">
<title>污水处理工刷题</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">

<style>
:root{
  --bg:#F2F4F9; --card:#ffffff; --pri:#1F6FE0; --pri-soft:#E8F0FE;
  --ok:#0F9D58; --ok-soft:#E6F4EA; --err:#D93025; --err-soft:#FCE8E6;
  --txt:#1B1F24; --sub:#6B7280; --line:#E4E8EF; --warn:#C55A11;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111418; --card:#1B1F26; --pri:#5B9BF8; --pri-soft:#1E2B3F;
    --ok:#4CC38A; --ok-soft:#16281F; --err:#F28B82; --err-soft:#2E1A18;
    --txt:#E6E9EF; --sub:#9AA4B2; --line:#2A303A; --warn:#E8A33D;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hd h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
.hd .sub{font-size:12px;color:var(--sub);margin-top:2px}
.back{width:36px;height:36px;border-radius:12px;border:none;background:var(--card);color:var(--txt);
  font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;flex:0 0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:12px}
.stat{display:flex;gap:10px;margin-bottom:14px}
.stat .it{flex:1;background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat .n{font-size:20px;font-weight:700;color:var(--pri)}
.stat .l{font-size:11px;color:var(--sub);margin-top:2px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:600;
  background:var(--pri);color:#fff;cursor:pointer;margin-bottom:10px;text-align:center}
.btn.sec{background:var(--card);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btn.ghost{background:transparent;color:var(--sub);font-weight:500}
.btn:disabled{opacity:.45}
.btn .d{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:3px}
.row{display:flex;gap:10px}
.row .btn{margin-bottom:0}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .2s}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:6px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-weight:600}
.stem{font-size:17px;line-height:1.6;font-weight:500;margin:10px 0 4px;word-break:break-word}
.stem .multi-hint{font-size:12px;color:var(--warn);font-weight:600;display:block;margin-top:6px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;
  margin-bottom:9px;background:var(--card);cursor:pointer;transition:background .12s,border-color .12s}
.opt .k{width:24px;height:24px;flex:0 0 auto;border-radius:50%;background:var(--bg);color:var(--sub);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt .t{flex:1;font-size:15.5px;line-height:1.5;word-break:break-word}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .k{background:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.err{border-color:var(--err);background:var(--err-soft)}
.opt.err .k{background:var(--err);color:#fff}
.ans{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:15px;font-weight:600;display:none}
.ans.show{display:block}
.ans.good{background:var(--ok-soft);color:var(--ok)}
.ans.bad{background:var(--err-soft);color:var(--err)}
.ans .exp{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-top:4px}
.foot{position:sticky;bottom:0;padding:10px 0 calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(180deg,transparent,var(--bg) 26%)}
.score{font-size:52px;font-weight:800;text-align:center;color:var(--pri);line-height:1.1}
.score small{font-size:15px;color:var(--sub);font-weight:500}
.res-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.res-row:last-child{border-bottom:none}
.res-row b{font-weight:700}
.scene-q{font-size:15.5px;line-height:1.65;font-weight:500}
.scene-a{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  font-size:14.5px;line-height:1.7;color:var(--txt);white-space:pre-wrap;word-break:break-word}
.scene.open .scene-a{display:block}
.more{font-size:12px;color:var(--pri);margin-top:8px;font-weight:600}
.wrong-item{font-size:14.5px;line-height:1.55;padding:12px 0;border-bottom:1px solid var(--line)}
.wrong-item:last-child{border-bottom:none}
.wrong-item .wq{font-weight:500}
.wrong-item .wa{font-size:13px;color:var(--ok);margin-top:5px;font-weight:600}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:36px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);
  font-size:14px;cursor:pointer;color:var(--txt);font-weight:500}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:8px}
.demo-badge{font-size:11px;color:var(--sub)}
</style>
</head>
<body>
<div id="app"></div>
<script>

测排放限值为10mg/L。\n2、工艺调控措施：\n①DO：加大曝气量，调高生化池溶解氧，建议生化池末端溶解氧控制在2mg/L以上，需要时可以短时间提至3-4mg/L。\n②分析出水氨氮变化：分析出水氨氮在线仪表数据变化趋势，初步判断是在线仪表故障（突变、长时间连续不变等）还是运行水质异常，同时电话联系出水在线仪表第三方运维单位立即到厂里检查仪表。\n③加测：取样加测水样氨氮，为分析工艺异常情况可同时多点取样，缩短分析等待时间。如出水泵房、深度处理、二沉池、生化池末端等，有多个生产序列无法确定异常序列时尤其需要加测。\n④分析运行情况：分析12小时内生产工艺运行参数及运行情况，包含进水水质（重点PH和氨氮）、池面DO、水量、出水水质（氨氮和SS）、污泥浓度变化等。\n⑤采取针对性措施：根据分析采取针对性的工艺调控措施。如氨氮偏高，除增加DO外，可以短时间降低进水量延长水力停留时间。"},{"q":"某生活污水厂执行城镇污水处理厂污染物排放标准江苏省地方标准（DB32／4440-2022)C标准。近期未下雨，作为运行处理班在岗人员注意到出水在线总磷为0.3mg/L，请判断出水总磷是否超标，并提出工艺调控措施。","a":"1、出水总磷未超标，但属于运行异常，总磷偏高。DB32C标准出水总磷日均限值0.5mg/L，总磷一次监测排放限值为1mg/L。\n2、工艺调控措施：\n①化学药剂：加大化学除磷药剂投加量，必要时可以考虑在生化池厌氧段投加碳源。\n②现场查看出水SS是否偏高，如出水悬浮物较多且出水总磷突变，重点解决出水SS多的问题，如深度处理段异常、二沉池异常等。\n③分析出水总磷变化：分析出水总磷在线仪表数据变化趋势，初步判断是在线仪表故障（突变、长时间连续不变等）还是运行水质异常，同时电话联系出水在线仪表第三方运维单位立即到厂里检查仪表。\n④加测：取样加测水样磷酸盐，为分析工艺异常情况可同时多点取样，缩短分析等待时间。如出水泵房、深度处理、二沉池等，有多个生产序列无法确定异常序列时尤其需要加测。\n⑤分析运行情况：分析24小时内生产工艺运行参数及运行情况，包含进水水质、池面DO、厌氧段ORP、水量、出水水质、外回流比、污泥浓度变化等。\n⑤采取针对性措施：根据分析采取针对性的工艺调控措施。"},{"q":"某生活污水厂执行城镇污水处理厂污染物排放标准江苏省地方标准（DB32／4440-2022)C标准。12月15日，天气晴朗，作为运行处理班在岗人员注意到出水在线仪表出水在线总氮为16mg/L，氨氮正常，请判断出水总氮是否超标，并提出工艺调控措施。","a":"1、出水总氮未超标，但属于运行异常，持续攀升可能造成日均总氮超标。DB32C标准11月1日一次年3月31日出水总氮日均限值15mg/L，总氮一次监测排放限值为20mg/L。\n2、工艺调控措施：\n①药剂投加：加大碳源投加量（可能投加在生化池，也可能是反硝化深床滤池）。\n②分析出水总氮变化：分析出水总氮在线仪表数据变化趋势，初步判断是在线仪表故障（突变、长时间连续不变等）还是运行水质异常，同时电话联系出水在线仪表第三方运维单位立即到厂里检查仪表。\n③控制DO：不要过高或过低，保证反硝化环境。\n④分析运行情况：分析24小时内生产工艺运行参数及运行情况，包含缺氧段ORP、内回流比、外回流比、进水水质及碳氮比、池面DO、水量、出水水质（氨氮和SS）、污泥浓度变化等。\n⑤采取针对性措施：根据分析采取针对性的工艺调控措施。\n⑥加测：取样加测水样总氮，为分析工艺异常情况可同时多点取样，缩短分析等待时间。如出水泵房、深度处理、二沉池等，有多个生产序列无法确定异常序列时尤其需要加测。"},{"q":"污泥脱水过程中（带式机或离心脱水机），巡视发现泥饼含水率明显偏高、泥饼偏湿，请分析可能的原因。（答出4条可满分）","a":"1、药剂：①絮凝剂PAM药剂溶解差、熟化时间不足，药剂质量问题等；②加药管道堵塞；③泥药配比不合适，药剂投加过量或不足。\n2、设备：①带式脱水机-冲洗水压力不足、冲洗管喷头堵塞等问题导致滤布未冲洗干净，滤带张力不足，滤带带速过快，布泥不均；②离心脱水机-差速度过高、转鼓转速过低、流量过高、转股和螺旋运行异常等；\n3、污泥：进泥含固率低、含水率高；污泥有机性偏高等。"}]};
const TY = {single:'单选题', multiple:'多选题', judge:'判断题'};
const KEY = {sess:'wsq_sess_v1', wrong:'wsq_wrong_v1', stat:'wsq_stat_v1'};

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = i => String.fromCharCode(65 + i);
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function shuffled(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function getQ(type, idx){ return DB[type][idx]; }
function optsOf(q, type){ return type === 'judge' ? ['正确','错误'] : q.o; }
function stat(){ return load(KEY.stat, {sets:0, answered:0, right:0}); }
function bumpStat(answered, right){ const s = stat(); s.sets++; s.answered += answered; s.right += right; save(KEY.stat, s); }
function wrong(){ return load(KEY.wrong, []); }
function addWrong(type, idx){
  const w = wrong();
  if (!w.some(x => x.type === type && x.idx === idx)) { w.push({type, idx}); save(KEY.wrong, w); }
}
function delWrong(type, idx){
  const w = wrong().filter(x => !(x.type === type && x.idx === idx)); save(KEY.wrong, w);
}
let SESS = load(KEY.sess, null);
let VIEW = 'home';
let DRILL = {type:'single', n:10};

/* ---------- 会话 ---------- */
function newSession(mode, spec){
  const items = [];
  ['single','multiple','judge'].forEach(t => {
    const n = spec[t] || 0;
    if (!n) return;
    const all = DB[t].map((_, i) => i);
    shuffled(all).slice(0, Math.min(n, all.length)).forEach(i => items.push({type:t, idx:i}));
  });
  const s = {mode, items, cur:0, startTs:Date.now(), finished:false,
             answers: items.map(() => ({picked:null, ok:null}))};
  SESS = s; save(KEY.sess, s);
  VIEW = 'quiz'; render();
}
function saveSess(){ save(KEY.sess, SESS); }
function scoreOf(s){
  let n = 0;
  s.answers.forEach(a => { if (a.ok) n++; });
  return n;
}

/* ---------- 渲染 ---------- */
function render(){
  const app = $('#app');
  if (VIEW === 'home') app.innerHTML = viewHome();
  else if (VIEW === 'quiz') app.innerHTML = viewQuiz();
  else if (VIEW === 'result') app.innerHTML = viewResult();
  else if (VIEW === 'wrong') app.innerHTML = viewWrong();
  else if (VIEW === 'scene') app.innerHTML = viewScene();
  else if (VIEW === 'drill') app.innerHTML = viewDrill();
  window.scrollTo(0, 0);
}

function header(title, sub, back){
  return `<div class="hd">${back ? '<button class="back" data-act="home">‹</button>' : ''}
    <div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div></div>`;
}

function viewHome(){
  const st = stat();
  const w = wrong().length;
  const total = DB.single.length + DB.multiple.length + DB.judge.length + DB.scene.length;
  const acc = st.answered ? Math.round(st.right / st.answered * 100) : 0;
  const unfinished = SESS && !SESS.finished ? SESS : null;
  const doneN = unfinished ? unfinished.answers.filter(a => a.ok !== null).length : 0;
  return `${header('污水处理工刷题', `题库 ${total} 题 · 单选 ${DB.single.length} / 多选 ${DB.multiple.length} / 判断 ${DB.judge.length} / 情景题 ${DB.scene.length}`)}
    <div class="stat">
      <div class="it"><div class="n">${st.sets}</div><div class="l">练习套数</div></div>
      <div class="it"><div class="n">${acc}%</div><div class="l">累计正确率</div></div>
      <div class="it"><div class="n">${w}</div><div class="l">错题数</div></div>
    </div>
    ${unfinished ? `<div class="card" style="border:1.5px solid var(--pri)">
        <div style="font-weight:700;margin-bottom:4px">上次练习未完成</div>
        <div class="note" style="margin-top:0">已完成 ${doneN} / ${unfinished.items.length} 题，可继续</div>
        <button class="btn" style="margin:12px 0 0" data-act="resume">继续上次答题</button>
      </div>` : ''}
    <button class="btn" data-act="mock">开始刷题 · 100 题
      <span class="d">与平台一致：单选 40 ＋ 多选 30 ＋ 判断 30</span></button>
    <button class="btn sec" data-act="drillpg">专项练习
      <span class="d">只练单选 / 多选 / 判断，自选题量</span></button>
    <button class="btn sec" data-act="wrongpg">错题本${w ? `（${w} 题）` : '（暂无）'}
      <span class="d">自动收集答错的题，可针对性重练</span></button>
    <button class="btn sec" data-act="scenepg">实操情景题背诵
      <span class="d">${DB.scene.length} 道情景问答，点开看参考答案</span></button>
    <div class="note" style="text-align:center;margin-top:18px">
      纯本地运行 · 不联网 · 数据只保存在本机<br>
      苹果：Safari 分享 →「添加到主屏幕」　安卓：Chrome 菜单 →「添加到主屏幕」
      <br><span style="opacity:.55;font-size:11px">数据版本 2026-11-08 v2</span>
    </div>`;
}

function viewQuiz(){
  const s = SESS, it = s.items[s.cur], q = getQ(it.type, it.idx), ans = s.answers[s.cur];
  const opts = optsOf(q, it.type);
  const answered = ans.ok !== null;
  const rightCount = scoreOf(s);
  const correctSet = it.type === 'multiple' ? q.a.split('') : (it.type === 'judge' ? [q.a] : [q.a]);
  const picked = ans.picked || [];
  let html = `${header('刷题练习', `${TY[it.type]} · 第 ${s.cur + 1} / ${s.items.length} 题`, true)}
    <div class="qmeta"><span>答对 ${rightCount} 题</span><span>${s.mode === 'mock' ? '模拟全套 100 题' : s.mode === 'wrong' ? '错题重练' : '专项练习'}</span></div>
    <div class="prog"><i style="width:${(s.cur + (answered ? 1 : 0)) / s.items.length * 100}%"></i></div>
    <div class="card">
      <div><span class="tag">${TY[it.type]}</span></div>
      <div class="stem">${esc(q.q)}${it.type === 'multiple' ? '<span class="multi-hint">多选题：选出全部正确选项后点「确认」</span>' : ''}</div>`;
  opts.forEach((t, i) => {
    const k = L(i);
    let cls = 'opt';
    if (answered) {
      if (correctSet.includes(k)) cls += ' ok';
      else if (picked.includes(i)) cls += ' err';
    } else if (picked.includes(i)) cls += ' sel';
    html += `<div class="${cls}" data-pick="${i}"><div class="k">${k}</div><div class="t">${esc(t)}</div></div>`;
  });
  if (answered) {
    const okTxt = ans.ok ? '回答正确' : '回答错误';
    const ansTxt = it.type === 'judge'
      ? (q.a === 'A' ? '正确' : '错误')
      : (it.type === 'multiple' ? q.a.split('').join('、') : q.a);
    html += `<div class="ans show ${ans.ok ? 'good' : 'bad'}">${okTxt}
      <span class="exp">正确答案：${ansTxt}</span></div>`;
  }
  html += `</div><div class="foot">`;
  if (it.type === 'multiple' && !answered) {
    html += `<button class="btn" data-act="submitmul" ${picked.length ? '' : 'disabled'}>确认作答（已选 ${picked.length} 项）</button>`;
  }
  if (answered) {
    html += `<button class="btn" data-act="next">${s.cur === s.items.length - 1 ? '完成并查看成绩' : '下一题'}</button>`;
    if (s.cur > 0) html += `<button class="btn ghost" data-act="prev">← 上一题</button>`;
  } else if (s.cur > 0) {
    html += `<button class="btn ghost" data-act="prev">← 上一题</button>`;
  }
  html += `</div>`;
  return html;
}

function viewResult(){
  const s = SESS;
  const score = scoreOf(s), n = s.items.length;
  const secs = Math.round((Date.now() - s.startTs) / 1000);
  const mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
  const pass = score >= Math.round(n * 0.6);
  const byType = {};
  s.items.forEach((it, i) => {
    byType[it.type] = byType[it.type] || {n:0, ok:0};
    byType[it.type].n++;
    if (s.answers[i].ok) byType[it.type].ok++;
  });
  let rows = '';
  ['single','multiple','judge'].forEach(t => {
    if (!byType[t]) return;
    rows += `<div class="res-row"><span>${TY[t]}</span><b>${byType[t].ok} / ${byType[t].n}</b></div>`;
  });
  return `${header('练习结果', s.mode === 'mock' ? '模拟全套 100 题' : s.mode === 'wrong' ? '错题重练' : '专项练习', true)}
    <div class="card">
      <div class="score">${score}<small> / ${n} 分</small></div>
      <div style="text-align:center;margin-top:6px;font-weight:700;color:${pass ? 'var(--ok)' : 'var(--err)'}">
        ${pass ? '✓ 及格（平台及格线 60%）' : '× 未及格（平台及格线 60%）'}</div>
      <div class="res-row" style="margin-top:14px"><span>用时</span><b>${mm}:${ss}</b></div>
      ${rows}
      <div class="res-row"><span>错题</span><b>${n - score} 题</b></div>
    </div>
    ${n - score > 0 ? `<button class="btn sec" data-act="wrongpg">查看错题本（${wrong().length}）</button>` : ''}
    <button class="btn" data-act="mock">再来一套（100 题）</button>
    <button class="btn ghost" data-act="home">返回首页</button>`;
}

function viewWrong(){
  const w = wrong();
  let list = '';
  w.forEach((x, i) => {
    const q = getQ(x.type, x.idx);
    const aTxt = x.type === 'judge' ? (q.a === 'A' ? '正确' : '错误') : q.a.split('').join('、');
    list += `<div class="wrong-item"><div class="wq">${i + 1}. ${esc(q.q)}</div>
      <div class="wa">正确答案：${aTxt}</div></div>`;
  });
  return `${header(`错题本（${w.length} 题）`, '答错的题会自动收录到这里', true)}
    ${w.length ? `<button class="btn" data-act="redowrong">重练错题（全部 ${w.length} 题）</button>
      <button class="btn ghost" data-act="clearwrong">清空错题本</button>
      <div class="card">${list}</div>` : `<div class="empty">还没有错题，继续加油 💪</div>`}`;
}

function viewScene(){
  let list = '';
  DB.scene.forEach((q, i) => {
    list += `<div class="card scene" data-scene="${i}">
      <div class="scene-q">${i + 1}. ${esc(q.q)}</div>
      <div class="more">点击查看参考答案 ▾</div>
      <div class="scene-a">${esc(q.a)}</div>
    </div>`;
  });
  return `${header(`实操情景题背诵（${DB.scene.length} 题）`, '点开卡片查看参考答案，合上可自测', true)}${list}`;
}

function viewDrill(){
  const types = [['single','单选题', DB.single.length], ['multiple','多选题', DB.multiple.length], ['judge','判断题', DB.judge.length]];
  let chips = types.map(([k, name, n]) =>
    `<div class="chip ${DRILL.type === k ? 'on' : ''}" data-dtype="${k}">${name} <span style="opacity:.7">${n}</span></div>`).join('');
  const maxN = DB[DRILL.type].length;
  const ns = [10, 20, 30, 50].filter(x => x <= maxN).concat([maxN]);
  let nchips = ns.map(n => `<div class="chip ${DRILL.n === n ? 'on' : ''}" data-dnum="${n}">${n === maxN ? '全部 ' : ''}${n} 题</div>`).join('');
  return `${header('专项练习', '选择题型与题量', true)}
    <div class="card"><div style="font-weight:600;margin-bottom:8px">题型</div><div class="chips">${chips}</div></div>
    <div class="card"><div style="font-weight:600;margin-bottom:8px">题量</div><div class="chips">${nchips}</div></div>
    <button class="btn" data-act="startdrill">开始练习</button>`;
}

/* ---------- 交互 ---------- */
function bindOnce(){
  document.body.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-pick],[data-dtype],[data-dnum],[data-scene]');
    if (!t) return;
    if (t.dataset.act) return act(t.dataset.act);
    if (t.dataset.pick !== undefined) return pick(+t.dataset.pick);
    if (t.dataset.dtype) { DRILL.type = t.dataset.dtype; DRILL.n = Math.min(DRILL.n, DB[DRILL.type].length); VIEW='drill'; render(); return; }
    if (t.dataset.dnum) { DRILL.n = +t.dataset.dnum; VIEW='drill'; render(); return; }
    if (t.dataset.scene !== undefined) {
      const c = t.closest('.scene'); c.classList.toggle('open');
      const more = c.querySelector('.more');
      more.textContent = c.classList.contains('open') ? '点击收起 ▴' : '点击查看参考答案 ▾';
      return;
    }
  });
}

function act(a){
  if (a === 'home') { VIEW = 'home'; if (SESS && SESS.finished) SESS = null; render(); return; }
  if (a === 'mock') { newSession('mock', {single:40, multiple:30, judge:30}); return; }
  if (a === 'drillpg') { VIEW = 'drill'; render(); return; }
  if (a === 'startdrill') { newSession('drill', {[DRILL.type]: DRILL.n}); return; }
  if (a === 'wrongpg') { VIEW = 'wrong'; render(); return; }
  if (a === 'scenepg') { VIEW = 'scene'; render(); return; }
  if (a === 'clearwrong') { save(KEY.wrong, []); VIEW = 'wrong'; render(); return; }
  if (a === 'redowrong') {
    const w = wrong();
    if (!w.length) return;
    const items = shuffled(w.slice());
    SESS = {mode:'wrong', items, cur:0, startTs:Date.now(), finished:false,
            answers: items.map(() => ({picked:null, ok:null}))};
    save(KEY.sess, SESS); VIEW = 'quiz'; render(); return;
  }
  if (a === 'resume') { VIEW = 'quiz'; render(); return; }
  if (a === 'submitmul') { judge(); return; }
  if (a === 'next') {
    if (SESS.cur === SESS.items.length - 1) finish();
    else { SESS.cur++; saveSess(); render(); }
    return;
  }
  if (a === 'prev') { SESS.cur = Math.max(0, SESS.cur - 1); saveSess(); render(); return; }
}

function pick(i){
  const s = SESS, it = s.items[s.cur], ans = s.answers[s.cur];
  if (ans.ok !== null) return;
  if (it.type === 'multiple') {
    const p = ans.picked || [];
    const ix = p.indexOf(i);
    if (ix >= 0) p.splice(ix, 1); else p.push(i);
    ans.picked = p;
    saveSess(); render();
  } else {
    ans.picked = [i];
    judge();
  }
}

function judge(){
  const s = SESS, it = s.items[s.cur], q = getQ(it.type, it.idx), ans = s.answers[s.cur];
  const picked = (ans.picked || []).slice().sort();
  const mine = picked.map(i => L(i)).sort().join('');
  const ok = mine === q.a;
  ans.ok = ok;
  if (!ok) addWrong(it.type, it.idx); else delWrong(it.type, it.idx);
  saveSess();
  render();
}

function finish(){
  SESS.finished = true;
  saveSess();
  const answered = SESS.items.length;
  bumpStat(answered, scoreOf(SESS));
  VIEW = 'result'; render();
}

/* 启动 */
bindOnce();
render();
</script>

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
